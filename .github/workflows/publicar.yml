name: Publicar o site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * *"   # todo dia às 6h17 de Brasília
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # se o YouTube mudar e a leitura falhar, o site é publicado com o catálogo que já existe
      - name: Atualizar o catálogo de vídeos
        if: github.event_name != 'push'
        continue-on-error: true
        run: python ferramentas/atualizar_videos.py

      - name: Gerar as páginas
        run: python gerar.py

      - name: Guardar o catálogo atualizado
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/videos.json site
          git diff --cached --quiet || (git commit -m "Atualiza o catálogo de vídeos" && git push)

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: publicacao
        uses: actions/deploy-pages@v4
